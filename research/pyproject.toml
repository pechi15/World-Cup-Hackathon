[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-cup-quant-research"
version = "0.1.0"
description = "Bounded quantitative research and independent model-governance framework"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "mypy>=1.11,<2", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["quant_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
